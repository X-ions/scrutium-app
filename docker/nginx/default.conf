server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # The application sets its own security headers, including the CSP. These
    # two are repeated here because they are cheap to enforce at the edge and
    # worth having even if a PHP request is never served.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Provider webhooks are the only unauthenticated POST endpoint, and they
    # arrive straight from the platforms rather than from browsers.
    # Liveness only: it reports that the process booted, and nothing about the
    # database, the queue or the configuration. There is deliberately no public
    # readiness endpoint — readiness is answered by `socialhub:doctor` on the
    # host, so a probe can never disclose the shape of the installation.
    location = /up {
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Hashed build assets are immutable, so they can be cached hard.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass  app:9000;
        fastcgi_index index.php;

        # A slow request is killed rather than tying up a worker, because a
        # provider call that hangs belongs on the queue, not in a web request.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # The real client IP and protocol, so rate limiting and HSTS see the
        # truth rather than the proxy's address.
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR   $proxy_add_x_forwarded_for;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
