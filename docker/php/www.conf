[www]
user = www-data
group = www-data
listen = 0.0.0.0:9000

; The scheduler and the queue workers run as CLI processes and do not go
; through this pool, so it is sized for web traffic only.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 3
pm.max_spare_servers = 8
pm.max_requests = 500

; Long-running provider calls happen on the queue, never in a web request.
request_terminate_timeout = 60
catch_workers_output = yes
decorate_workers_output = no

clear_env = no
