; Runtime settings shared by php-fpm and the CLI.

memory_limit = 512M

; Media uploads are validated against the app's own allow-list and cap, but
; post_max_size has to be at least as large or a large upload is truncated
; before PHP ever sees it. Raise both together.
upload_max_filesize = 64M
post_max_size = 72M

max_execution_time = 60
memory_limit = 512M

; Never leak a stack trace or a file path to a browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; A request body larger than this is refused before it is parsed.
; (post_max_size above is the real limit; this is the early guard.)

date.timezone = UTC
