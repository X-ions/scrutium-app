name: CD

on:
  # Deploy on push to main (adjust branch as needed)
  push:
    branches: [main]
  # Manual trigger from Actions tab
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
  # Optional: deploy on published GitHub Release
  release:
    types: [published]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # needed for OIDC / cloud providers

env:
  # Set these as repository secrets / variables in Settings → Secrets and variables
  # NODE_ENV: production

jobs:
  # ---------------------------------------------------------------------------
  # Build once, then promote artifact to environments
  # ---------------------------------------------------------------------------
  build:
    name: Build for deploy
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set image metadata
        id: meta
        run: |
          echo "tags=scrutium:${{ github.sha }}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Deploy to Staging
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      # url: https://staging.scrutium.com   # uncomment when live
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Example: Vercel / Netlify / Railway / custom SSH / kubectl
      # - name: Deploy to staging
      #   env:
      #     DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
      #   run: |
      #     echo "Deploy ${{ needs.build.outputs.image-tag }} to staging"

      - name: Placeholder deploy
        run: |
          echo "Staging deploy ready"
          echo "Target: ${{ needs.build.outputs.image-tag }}"

  # ---------------------------------------------------------------------------
  # Deploy to Production (requires approval via GitHub Environment protection)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      # url: https://app.scrutium.com
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Deploy to production
      #   env:
      #     DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
      #   run: |
      #     echo "Deploy ${{ needs.build.outputs.image-tag }} to production"

      - name: Placeholder deploy
        run: |
          echo "Production deploy ready (protect this environment in repo Settings)"
          echo "Target: ${{ needs.build.outputs.image-tag }}"
