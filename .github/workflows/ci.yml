name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP syntax
        run: find app database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for feature tests
        run: npm run build

      - name: Run tests
        run: php artisan test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend sources
        run: npm run lint

      - name: Build frontend
        run: npm run build

  smoke:
    name: Deployed smoke test
    runs-on: ubuntu-latest
    # Runs against the live deployment, so only after a push to main lands.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment to settle
        run: sleep 45

      - name: Application responds
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -o /dev/null -w '%{http_code}\n' \
            https://scrutium.vercel.app/signin

      - name: Database health check reports ok
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors https://scrutium.vercel.app/health/db)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Known-advisory baseline: 38 advisories remain in guzzlehttp/* and
      # laravel/framework that are not resolvable without a major upgrade.
      # Tracked in TODO.md; non-blocking so the rest of the gate stays meaningful.
      - name: Audit Composer dependencies
        continue-on-error: true
        run: composer audit --no-interaction

      - name: Audit production npm dependencies
        run: npm ci && npm audit --omit=dev --audit-level=high