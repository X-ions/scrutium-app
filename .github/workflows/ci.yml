      #     files: ./coverage/lcov.info

      - name: Placeholder
        run: echo "Test job ready — enable steps after adding test suite"

  # ---------------------------------------------------------------------------
  # Build (frontend / backend / docs)
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: "**/package-lock.json"

