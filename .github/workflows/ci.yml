name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check PHP syntax
        run: find app database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets for feature tests
        run: npm run build

      - name: Run tests
        run: php artisan test

      # The suite above runs on SQLite because it is fast. Migrations that use
      # ->change(), generated columns or engine-specific DDL are only really
      # exercised on the production driver, so the migrations are also applied
      # to a real PostgreSQL and MySQL here.
      - name: SocialHub diagnostics
        run: php artisan socialhub:doctor --json
        continue-on-error: true

  migrations:
    name: Migrations on ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mysql]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: socialhub
          POSTGRES_USER: socialhub
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U socialhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: socialhub
          MYSQL_ROOT_PASSWORD: secret
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: ${{ matrix.database == 'pgsql' && '127.0.0.1' || '127.0.0.1' }}
      DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
      DB_DATABASE: socialhub
      DB_USERNAME: ${{ matrix.database == 'pgsql' && 'socialhub' || 'root' }}
      DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'secret' || 'secret' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_pgsql, pdo_mysql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Apply every migration from empty
        run: php artisan migrate:fresh --force

      - name: Migrations are reversible
        run: php artisan migrate:rollback --step=1000 --force

      - name: Re-apply after rollback
        run: php artisan migrate --force

  docker:
    name: Production image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build the application image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: socialhub:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the proxy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nginx
          push: false
          load: true
          tags: socialhub-nginx:ci

      - name: The image is self-consistent
        run: |
          docker run --rm --entrypoint php socialhub:ci -r '
            $manifest = "public/build/manifest.json";
            if (! file_exists($manifest)) { fwrite(STDERR, "missing asset manifest\n"); exit(1); }
            if (! class_exists("App\\Services\\Social\\SocialProviderRegistry")) { fwrite(STDERR, "autoloader is broken\n"); exit(1); }
            echo "image ok\n";
          '

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint frontend sources
        run: npm run lint

      - name: Build frontend
        run: npm run build

  smoke:
    name: Deployed smoke test
    runs-on: ubuntu-latest
    # Runs against the live deployment, so only after a push to main lands.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for deployment to settle
        run: sleep 45

      - name: Application responds
        run: |
          curl -fsS --retry 3 --retry-delay 10 --retry-all-errors -o /dev/null -w '%{http_code}\n' \
            https://scrutium.vercel.app/signin

      - name: Database health check reports ok
        run: |
          body=$(curl -fsS --retry 3 --retry-delay 10 --retry-all-errors https://scrutium.vercel.app/health/db)
          echo "$body"
          echo "$body" | grep -q '"ok":true'

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Known-advisory baseline: 38 advisories remain in guzzlehttp/* and
      # laravel/framework that are not resolvable without a major upgrade.
      # Tracked in TODO.md; non-blocking so the rest of the gate stays meaningful.
      - name: Audit Composer dependencies
        continue-on-error: true
        run: composer audit --no-interaction

      - name: Audit production npm dependencies
        run: npm ci && npm audit --omit=dev --audit-level=high